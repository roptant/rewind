name: Build/release v2

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish artifacts to GitHub Releases'
        required: false
        default: 'false'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout code (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Node.js and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --ignore-scripts

      - name: Unpack native Realm N-API prebuild & Electron binary
        run: |
          node node_modules/electron/install.js
          npx --prefix node_modules/realm prebuild-install -r napi

      - name: Build production bundles
        run: npx nx run-many --skip-nx-cache --target=build --projects=desktop-frontend,desktop-main --prod

      - name: Package & publish Electron app (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage tar.gz --publish ${{ inputs.release == 'true' && 'always' || 'never' }}

      - name: Package & publish Electron app (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish ${{ inputs.release == 'true' && 'always' || 'never' }}
